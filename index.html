<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Revenda Tech</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; connect-src https://*.supabase.co; img-src 'self' data: blob: https://*.supabase.co; base-uri 'none'; form-action 'none'">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f4f5f7; --bar:rgba(244,245,247,.86); --surface:#ffffff; --surface2:#f7f8fa;
  --border:#e5e7eb; --border-strong:#d3d8e0;
  --text:#0f172a; --text2:#475569; --muted:#8492a6;
  --primary:#2457e6; --primary-soft:#e9effd; --on-primary:#ffffff;
  --ok:#15803d; --ok-soft:#e6f5ec; --warn:#b45309; --warn-soft:#fdf1da; --bad:#b91c1c; --bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(15,23,42,.05);
  --radius:14px; --sab:env(safe-area-inset-bottom,0px);
}
:root[data-theme=dark]{
  --bg:#0a0e16; --bar:rgba(10,14,22,.86); --surface:#111826; --surface2:#0d1420;
  --border:#1d2a3d; --border-strong:#2a3a54;
  --text:#e8edf5; --text2:#a7b4c8; --muted:#73839b;
  --primary:#5b8cff; --primary-soft:#15233f; --on-primary:#0a0e16;
  --ok:#4ade80; --ok-soft:#10281a; --warn:#fbbf24; --warn-soft:#2e2310; --bad:#f87171; --bad-soft:#2f1517;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:calc(88px + var(--sab))}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.ic{flex:none;display:block}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* Barre du haut */
.topbar{position:sticky;top:0;z-index:30;background:var(--bar);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border)}
.topbar .wrap{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#7c9bff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.page-h{flex-wrap:wrap}
.page-h>div:first-child{flex:1 1 100%;min-width:0}
.page-h .seg{width:100%}
.page-h .seg button{flex:1;padding:7px 4px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.14)}
:root[data-theme=dark] .seg button.on{background:var(--border-strong)}

main{padding-top:18px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.page-h h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.page-h .sub{font-size:13px;color:var(--muted);margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 8px}
.sec-h h2{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.link{border:0;background:none;color:var(--primary);font-size:13px;font-weight:600;padding:4px 2px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* Hero + KPI */
.hero{padding:18px;background:linear-gradient(160deg,var(--surface),var(--surface2))}
.lbl{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.02em}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero-val{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.15}
.hero-sub{font-size:13px;color:var(--muted)}
.kpi{padding:14px}
.kpi .v{font-size:19px;font-weight:700;margin-top:4px;letter-spacing:-.01em;word-break:break-word}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.stat{padding:12px}
.stat .v{font-size:16px;font-weight:700;margin-top:2px}
.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}.mutedc{color:var(--muted)}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;line-height:1.5;background:var(--surface2);color:var(--text2);border:1px solid var(--border);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.pri{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.grade{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:700}
.grade.A{background:var(--ok-soft);color:var(--ok)}
.grade.B{background:var(--primary-soft);color:var(--primary)}
.grade.C{background:var(--warn-soft);color:var(--warn)}
.grade.D{background:var(--bad-soft);color:var(--bad)}

/* Listes */
.list{overflow:hidden}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left;border-bottom:1px solid var(--border)}
.rw:last-child{border-bottom:0}
.rw:active{background:var(--surface2)}
.ph-strip{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.ph-strip::-webkit-scrollbar{display:none}
.ph-strip button{flex:none;width:92px;height:92px;border-radius:12px;border:1px solid var(--border);background:var(--surface2) center/cover no-repeat;padding:0}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph-cell{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid var(--border);background:var(--surface2) center/cover no-repeat;overflow:hidden}
.ph-cell .rm{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(15,23,42,.72);color:#fff;display:grid;place-items:center;padding:0}
.ph-add{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--border2);background:none;color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:600;gap:2px;padding:0;cursor:pointer}
.ph-add span{display:grid;justify-items:center;gap:2px}
.tile.has-img{background-size:cover;background-position:center;background-repeat:no-repeat;color:transparent}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);margin-bottom:12px}
.sw b{display:block;font-size:14px}.sw small{color:var(--muted);font-size:12px}
.sw input{width:22px;height:22px;accent-color:var(--primary);flex:none}
.lb{position:fixed;inset:0;z-index:90;background:rgba(2,6,23,.92);display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .xbtn{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.16);color:#fff}
.tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary)}
.tile.big{width:48px;height:48px;border-radius:13px}
.tile.sm{width:32px;height:32px;border-radius:9px}
.tile.warnt{background:var(--warn-soft);color:var(--warn)}
.tile.badt{background:var(--bad-soft);color:var(--bad)}
.tile.okt{background:var(--ok-soft);color:var(--ok)}
.rw-main{flex:1;min-width:0}
.rw-t{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.rw-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;flex:none}
.rw-r b{font-size:15px;color:var(--text)}
.chev{color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}

/* Recherche / filtres */
.search{position:relative;margin-bottom:10px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.in{width:100%;height:44px;padding:0 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.in:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search .in{padding-left:38px}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.in{height:auto;padding:10px 12px;resize:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.toolbar .in{height:38px;font-size:14px;width:auto;min-width:150px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:600;font-size:15px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{color:var(--bad);border-color:var(--border-strong)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btns .full{grid-column:1/-1}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(78px + var(--sab));width:54px;height:54px;border-radius:17px;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 8px 22px rgba(36,87,230,.35);z-index:25}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--border);padding-bottom:var(--sab)}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 6px}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav button.on{color:var(--primary)}
nav button.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--primary)}

/* Formulaires */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.inwrap{position:relative}
.inwrap .in{padding-right:52px}
.inwrap .cur{position:absolute;right:12px;top:0;height:44px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est{display:flex;justify-content:space-between;align-items:center;border-radius:11px;padding:10px 12px;background:var(--surface2);border:1px dashed var(--border-strong);font-size:13px;margin-bottom:12px}
.gbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gbtn{height:44px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-weight:700}
.gbtn.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);color:var(--primary)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

/* Feuille (modale) */
.backdrop{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + var(--sab));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sh-bar{position:relative;display:flex;justify-content:center;align-items:center;height:34px;margin-bottom:8px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--border-strong)}
.xbtn{position:absolute;right:-4px;top:0;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);color:var(--text2);display:grid;place-items:center}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-head h3{font-size:18px;font-weight:700;line-height:1.25}
.sh-title{font-size:18px;font-weight:700;margin-bottom:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.kv>div{background:var(--surface);padding:10px 12px}
.kv small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv b{display:block;font-size:15px;margin-top:2px;word-break:break-word}
.note{margin-top:12px;padding:10px 12px;border-radius:11px;background:var(--surface2);border:1px solid var(--border);font-size:13px;color:var(--text2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translate(-50%,10px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.22s;pointer-events:none;z-index:90;display:flex;gap:8px;align-items:center;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Etats vides / chargement */
.empty{text-align:center;padding:34px 18px}
.empty .tile{margin:0 auto 12px;width:52px;height:52px;border-radius:15px}
.empty b{display:block;font-size:15px}
.empty p{font-size:13px;color:var(--muted);margin-top:4px}
.sk{border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0%,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border:1px solid var(--border);margin-bottom:10px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* Graphique */
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--border);stroke-dasharray:2 4}
.chart .b1{fill:var(--primary);opacity:.22}
.chart .b2{fill:var(--primary)}
.chart .b3{fill:var(--bad)}
.chart .lb{fill:var(--muted);font-size:9px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Facture (toujours sur fond clair pour l'impression) */
.inv{background:#fff;color:#0f172a;border-radius:12px;padding:20px;font-size:13px;line-height:1.5;border:1px solid #e2e8f0}
.inv .top{display:flex;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:2px solid #0f172a}
.inv .brand-n{font-size:16px;font-weight:700}
.inv .sm{color:#475569;font-size:12px}
.inv .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;color:#fff;background:#0f172a;border-radius:6px;padding:3px 9px}
.inv .no{font-size:18px;font-weight:700;margin-top:6px;white-space:nowrap}
.inv .top>div:last-child{flex:none}
.inv .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.inv .meta small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;color:#64748b;text-transform:uppercase;margin-bottom:3px}
.inv table{width:100%;border-collapse:collapse;table-layout:fixed}
.inv th:nth-child(2){width:44px}
.inv th:nth-child(3){width:38%}
.inv td{overflow-wrap:anywhere}
.inv th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;border-bottom:1px solid #cbd5e1;padding:7px 4px}
.inv td{padding:10px 4px;border-bottom:1px solid #e2e8f0;vertical-align:top}
.inv .r{text-align:right;white-space:nowrap}
.inv .totals{margin:14px 0 0 auto;width:62%;background:#f1f5f9;border-radius:10px;padding:10px 12px}
.inv .totals .tl{display:flex;justify-content:space-between;font-size:16px;font-weight:700}
.inv .stamp{display:inline-block;margin-top:6px;border:1.5px solid #15803d;color:#15803d;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;letter-spacing:.1em}
.inv .ft{margin-top:16px;padding-top:10px;border-top:1px solid #e2e8f0;color:#64748b;font-size:11.5px}
@media print{
  @page{margin:12mm}
  body{background:#fff;padding:0}
  body *{visibility:hidden}
  #inv,#inv *{visibility:visible}
  #inv{position:absolute;left:0;top:0;width:100%;border:0;border-radius:0}
  .backdrop{background:none}
}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <div class="brand"><div class="mark" id="mark">R</div><div class="brand-t"><b id="biz">Revenda Tech</b><span id="pg"></span></div></div>
  <div class="seg" id="langseg"><button data-a="lang" data-id="fr">FR</button><button data-a="lang" data-id="pt">PT</button></div>
</div></header>
<main class="wrap" id="main"></main>
<button class="fab" id="fab" data-a="add" aria-label="+"></button>
<nav><div class="wrap" id="nav"></div></nav>
<div id="toast"></div>
<div id="modal"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
try { if (tg) { tg.ready(); tg.expand(); } } catch(e){}
const $ = id => document.getElementById(id);

/* ============ Traductions ============ */
const I18N = {
fr: {
  app:"Revenda Tech", nDash:"Accueil", nStock:"Stock", nSales:"Ventes", nInv:"Factures", nSet:"Réglages",
  tDash:"Tableau de bord", tStock:"Stock", tSales:"Ventes", tInv:"Factures", tSet:"Réglages",
  hello:"Bonjour", p7:"7 j", p30:"30 j", p90:"90 j", pAll:"Tout",
  netProfit:"Bénéfice net", revenue:"Chiffre d'affaires", avgMargin:"Marge moyenne", stockValue:"Valeur du stock",
  potential:"Bénéfice potentiel", ifAllSold:"si tout est vendu", vsPrev:"vs période préc.",
  sale1:"vente", saleN:"ventes", inv1:"facture", invN:"factures", item1:"article", itemN:"articles",
  chartTitle:"Évolution", legRev:"Chiffre d'affaires", legProfit:"Bénéfice", noData:"Pas encore de ventes sur cette période",
  watch:"À surveiller", dormant:"Stock dormant", belowCost:"Prix inférieur au coût", allGood:"Rien à signaler. Bon travail !",
  inStockFor:"En stock depuis", seeStock:"Voir le stock", byType:"Stock par catégorie", recentSales:"Dernières ventes", seeAll:"Tout voir",
  phone:"Téléphone", laptop:"Ordinateur portable", desktop:"Unité centrale", screen:"Écran", accessory:"Accessoire", other:"Autre",
  search:"Rechercher un article, un IMEI…", all:"Tous", available:"Disponible", reserved:"Réservé", sold:"Vendu", status:"Statut",
  sortRecent:"Plus récents", sortOld:"Plus anciens", sortPrice:"Prix décroissant", sortMargin:"Meilleure marge",

function loadPrefs(){
  try { const d = JSON.parse(localStorage.getItem(PREF)); if (d && d.lang) return { items: [], lang: d.lang, currency: d.currency || 'BRL' }; } catch(e){}
  const tl = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || 'fr').toLowerCase();
  return { items: [], lang: tl.startsWith('pt') ? 'pt' : 'fr', currency: tl.startsWith('pt') ? 'BRL' : 'XOF' };
}
function save(){ try { localStorage.setItem(PREF, JSON.stringify({ lang: S.lang, currency: S.currency })); } catch(e){} }

/* ============ API securisee (signature Telegram a chaque requete) ============ */
async function api(action, payload){
  const initData = tg && tg.initData;
  if (!initData) throw new Error('NO_TG');
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData }, body: JSON.stringify(Object.assign({ action }, payload || {})) });
  } catch(e) { throw new Error('NET'); }
  if (r.status === 401 || r.status === 403) throw new Error('DENIED');
  if (!r.ok) {
    let code = 'NET';
    try { const j = await r.json(); if (j && /^bad_/.test(j.error || '')) code = j.error; } catch(e) {}
    throw new Error(code);
  }
  return r.json();
}
async function refresh(){
  try {
    const [d, p, v] = await Promise.all([api('list'), api('profile_get'), api('invoice_list')]);
    S.items = d.items || []; S.profile = p.profile || S.profile;
    if (S.profile.currency && CURRENCIES.includes(S.profile.currency)) { S.currency = S.profile.currency; save(); } S.invoices = v.invoices || []; ST.err = '';
  } catch(e) { ST.err = e.message; }
  ST.loading = false; render();
}
async function sync(action, payload){
  try { await api(action, payload); }
  catch(e) { toast(t('errNet')); await refresh(); }
}

const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const sum = (l, f) => l.reduce((a, x) => a + f(x), 0);
const loc = lang => (lang || S.lang) === 'pt' ? 'pt-BR' : 'fr-FR';

}

const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };
const fmtDate = (d, lang) => { try { return new Date(d + 'T00:00:00').toLocaleDateString(loc(lang)); } catch(e){ return d || ''; } };

function toast(msg){
  const el = $('toast'); el.innerHTML = ico('check', 16) + '<span>' + esc(msg) + '</span>'; el.classList.add('show');

function ask(msg, cb){ if (tg && tg.showConfirm) tg.showConfirm(msg, ok => ok && cb()); else if (confirm(msg)) cb(); }

  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){} ta.remove(); }

/* ============ Agregats ============ */
function aggRange(from, to){
  const list = S.items.filter(i => i.status === 'sold' && i.soldDate && (!from || i.soldDate >= from) && (!to || i.soldDate <= to));
  const rev = sum(list, i => num(i.soldPrice)), cost = sum(list, totalCost);
  return { list, n: list.length, rev, cost, profit: rev - cost };
}
const aggPeriod = p => p === 'all' ? aggRange(null, null) : aggRange(daysAgo(Number(p) - 1), today());

function buckets(p){
  const out = [];
  if (p === 'all'){
    const now = new Date();
    for (let k = 5; k >= 0; k--){
      const d = new Date(now.getFullYear(), now.getMonth() - k, 1), e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      out.push({ from: ymd(d), to: ymd(e), label: d.toLocaleDateString(loc(), { month: 'short' }) });
    }
    return out;
  }
  const n = Number(p), cnt = n === 7 ? 7 : n === 30 ? 6 : 9, size = n / cnt;
  for (let k = 0; k < cnt; k++){
    const startOff = n - 1 - k * size, endOff = startOff - (size - 1);
    out.push({ from: daysAgo(startOff), to: daysAgo(endOff), label: shortDate(daysAgo(endOff)) });
  }
  return out;
}

function chartSVG(bs, data){
  const W = 320, H = 132, pad = 4, base = H - 20, top = 8, hh = base - top;
  const max = Math.max(1, ...data.map(d => d.rev)), bw = (W - pad * 2) / data.length, g = bw * 0.3;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let k = 0; k <= 2; k++){ const y = top + hh * k / 2; s += `<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }
  data.forEach((d, i) => {
    const x = pad + i * bw + g / 2, w = bw - g, hr = d.rev > 0 ? Math.max(3, d.rev / max * hh) : 0, hp = d.profit > 0 ? d.profit / max * hh : 0;
    if (hr) s += `<rect class="b1" x="${x.toFixed(1)}" y="${(base - hr).toFixed(1)}" width="${w.toFixed(1)}" height="${hr.toFixed(1)}" rx="3"/>`;
    if (hp) s += `<rect class="b2" x="${x.toFixed(1)}" y="${(base - hp).toFixed(1)}" width="${w.toFixed(1)}" height="${hp.toFixed(1)}" rx="3"/>`;
    else if (d.profit < 0) s += `<rect class="b3" x="${x.toFixed(1)}" y="${base - 3}" width="${w.toFixed(1)}" height="3" rx="1.5"/>`;
    if (i === 0 || i === data.length - 1 || i === Math.floor(data.length / 2)) s += `<text class="lb" x="${(x + w / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${esc(bs[i].label)}</text>`;
  });
  return s + '</svg>';
}

// Compresse en JPEG (max 1000 px, <= ~350 Ko) : renvoie du base64 sans prefixe
async function compress(file){
  if (!file || !/^image\//.test(file.type)) throw new Error('bad');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ko; im.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight; if (!w || !h) throw new Error('bad');
    let sc = Math.min(1, 1000 / Math.max(w, h));
    for (let k = 0; k < 4; k++) {
      const c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      for (const q of [0.8, 0.68, 0.55]) {
        const d = c.toDataURL('image/jpeg', q), b = d.slice(d.indexOf(',') + 1);
        if (b.length * 0.75 <= 350000) return { b64: b, preview: d };
      }
      sc *= 0.75;
    }
    throw new Error('big');
  } finally { URL.revokeObjectURL(url); }
}

/* ============ Feuilles (modales) ============ */
function sheet(html){
  $('modal').innerHTML = `<div class="backdrop" data-a="backdrop"><div class="sheet" role="dialog" aria-modal="true"><div class="sh-bar"><div class="grab"></div><button class="xbtn" data-a="close" aria-label="${esc(t('close'))}">${ico('x', 17)}</button></div>${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  try { tg.BackButton.show(); } catch(e){}
}
function closeModal(){
  $('modal').innerHTML = ''; $('modal').oninput = null; document.body.style.overflow = '';
  try { tg.BackButton.hide(); } catch(e){}
}
try { tg.BackButton.onClick(closeModal); } catch(e){}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const kv = (l, v) => `<div><small>${l}</small><b>${v}</b></div>`;
const inMoney = (id, v, ph) => `<div class="inwrap"><input class="in" id="${id}" inputmode="decimal" value="${esc(v || '')}" placeholder="${esc(ph || '0')}"><span class="cur">${esc(S.currency)}</span></div>`;

function openItem(id){
  const i = S.items.find(x => x.id === id); if (!i) return;
  const tc = totalCost(i), gain = num(i.price) - tc, mp = num(i.price) > 0 ? gain / num(i.price) * 100 : 0;
  sheet(`
  ${photoUrls(i).length ? `<div class="ph-strip">${photoUrls(i).map(u => `<button type="button" data-a="lb" data-u="${esc(u)}" style="background-image:url('${esc(u)}')" aria-label="photo"></button>`).join('')}</div>` : ''}
  <div class="sh-head"><span class="tile big">${ico(TYPE_ICO[i.type] || 'box', 24)}</span><div><h3>${esc(i.name)}</h3><div class="rw-s">${gradeBadge(i.condition)}<span>${esc(gradeLabel(i.condition))}</span>${i.status === 'reserved' ? pill(t('reserved'), 'warn') : pill(t('available'), 'ok')}</div></div></div>
  <div class="kv">
    ${kv(t('fCost'), money(num(i.cost)))}${kv(t('fRepair'), money(num(i.repair)))}
    ${kv(t('totalCost'), money(tc))}${kv(t('fPrice'), money(num(i.price)))}
    ${kv(t('margin'), `<span class="${gain >= 0 ? 'okc' : 'badc'}">${gain >= 0 ? '+' : ''}${money(gain)} (${mp.toFixed(0)} %)</span>`)}${kv(t('inStockFor'), daysIn(i) + ' ' + t('daysShort'))}

function openForm(id){
  const i = id ? S.items.find(x => x.id === id) : { type:'phone', condition:'B', status:'stock' };
  sheet(`
  <div class="sh-title">${id ? t('editItem') : t('addItem')}</div>
  <div class="fld"><label>${t('fType')}</label><select class="in" id="f-type">${TYPES.map(k => `<option value="${k}" ${k === i.type ? 'selected' : ''}>${t(k)}</option>`).join('')}</select></div>

  <div class="fld"><label>${t('fCond')}</label><input type="hidden" id="f-cond" value="${esc(i.condition || 'B')}"><div class="gbtns">${['A','B','C','D'].map(g => `<button type="button" class="gbtn ${g === (i.condition || 'B') ? 'on' : ''}" data-a="grade" data-id="${g}">${g}</button>`).join('')}</div><div class="hint" id="g-hint">${esc(gradeLabel(i.condition || 'B'))}</div></div>

  <div class="two"><div class="fld"><label>${t('fCost')}</label>${inMoney('f-cost', i.cost)}</div><div class="fld"><label>${t('fRepair')}</label>${inMoney('f-repair', i.repair)}</div></div>

  <label class="sw"><span><b>${t('pub')}</b><small>${t('pubHint')}</small></span><input type="checkbox" id="f-pub" ${i.published ? 'checked' : ''}></label>
  <div class="btns"><button class="btn" data-a="close">${t('cancel')}</button><button class="btn pri" id="f-save">${t('save')}</button></div>`);
  const upd = () => {
    const c = num($('f-cost').value) + num($('f-repair').value), p = num($('f-price').value), g = p - c;
    $('f-est').innerHTML = p > 0 ? `<span class="${g >= 0 ? 'okc' : 'badc'}">${g >= 0 ? '+' : ''}${money(g)} · ${(g / p * 100).toFixed(0)} %</span>` : '—';
  };
  $('modal').oninput = upd; upd();
  const pend = [];                       // nouvelles photos (pas encore envoyees)
  const have = () => (id ? (S.items.find(x => x.id === id) || {}).photos || [] : []);
  const drawPh = () => {
    const ex = have().filter(x => okImg(x.u)), cells = ex.map(x => `<div class="ph-cell" style="background-image:url('${esc(x.u)}')"><button type="button" class="rm" data-rm="e" data-p="${esc(x.p)}" aria-label="x">${ico('x', 13)}</button></div>`)
      .concat(pend.map((x, n) => `<div class="ph-cell" style="background-image:url('${x.preview}')"><button type="button" class="rm" data-rm="n" data-n="${n}" aria-label="x">${ico('x', 13)}</button></div>`));
    if (cells.length < 4) cells.push(`<button type="button" class="ph-add" id="ph-add"><span>${ico('camera', 22)}${t('addPhoto')}</span></button>`);
    $('ph-grid').innerHTML = cells.join('');
  };
  drawPh();
  $('ph-grid').onclick = e => {
    if (e.target.closest('#ph-add')) { $('ph-file').click(); return; }
    const rm = e.target.closest('.rm'); if (!rm) return;
    if (rm.dataset.rm === 'n') { pend.splice(Number(rm.dataset.n), 1); drawPh(); return; }
    const path = rm.dataset.p;
    ask(t('photoDel'), async () => {
      try { const r = await api('photo_delete', { itemId: id, path }); const it0 = S.items.find(x => x.id === id); if (it0) it0.photos = r.photos || []; drawPh(); }
      catch(err) { toast(t('errNet')); }
    });
  };
  $('ph-file').onchange = async e => {
    const files = Array.from(e.target.files || []); e.target.value = '';
    for (const f of files) {
      if (have().length + pend.length >= 4) break;
      try { pend.push(await compress(f)); } catch(err) { toast(t('photoErr')); }
    }
    drawPh();
  };
  $('f-save').onclick = async () => {
    const name = $('f-name').value.trim(), cost = $('f-cost').value;
    if (!name || cost === '') { toast(t('required')); return; }
    const data = { type: $('f-type').value, name, condition: $('f-cond').value, serial: $('f-serial').value.trim(),
      cost: num(cost), repair: num($('f-repair').value), price: num($('f-price').value), notes: $('f-notes').value.trim(), published: $('f-pub').checked };
    let it;
    if (id) { it = S.items.find(x => x.id === id); Object.assign(it, data); }
    else { it = Object.assign({ id: crypto.randomUUID(), status: 'stock', created: Date.now(), photos: [] }, data); S.items.push(it); }
    const up = pend.slice();
    closeModal(); toast(t(up.length ? 'photoUp' : 'saved')); haptic(); render();
    if (up.length) {
      try { await api('upsert', { item: it }); await uploadPhotos(it, up); toast(t('saved')); }
      catch(err) { toast(t('errNet')); await refresh(); }
    } else sync('upsert', { item: it });
  };
}

const invLabels = v => k => (I18N[v.lang] && I18N[v.lang][k]) || k;
const invDateStr = v => fmtDate(v.date, v.lang);

function invoiceHTML(v){
  const L = invLabels(v), s = v.seller || {};
  const lines = [
    `<b>${esc(v.itemName)}</b>`,
    v.itemCondition ? L('invGrade') + ': ' + esc(L('g' + v.itemCondition)) : '',
    v.itemSerial ? L('invSerial') + ': ' + esc(v.itemSerial) : '',
    v.warrantyDays > 0 ? L('invWarranty') + ': ' + esc(v.warrantyDays) + ' ' + L('days') : ''
  ].filter(Boolean);
  const tot = fmtMoney(v.amount, v.currency, v.lang);
  return `<div class="inv" id="inv">
    <div class="top">
      <div><div class="brand-n">${esc(s.businessName)}</div><div class="sm">${[s.address, s.phone, s.taxId ? L('bizTax') + ': ' + s.taxId : ''].filter(Boolean).map(esc).join('<br>')}</div></div>
      <div style="text-align:right"><span class="tag">${L('invoice')}</span><div class="no">${L('invNo')} ${invNo(v.number)}</div><div class="sm">${esc(invDateStr(v))}</div></div>
    </div>
    <div class="meta">
      <div><small>${L('invBuyer')}</small><b>${esc(v.buyerName)}</b>${v.buyerPhone ? '<br>' + esc(v.buyerPhone) : ''}${v.buyerDoc ? '<br>' + esc(v.buyerDoc) : ''}</div>
      <div><small>${L('invPaid')}</small><b>${L('pay_' + v.payment)}</b><br><span class="stamp">${L('paid')}</span></div>
    </div>
    <table><tr><th>${L('invDesc')}</th><th class="r">${L('invQty')}</th><th class="r">${L('invTotal')}</th></tr>
    <tr><td>${lines.join('<br>')}</td><td class="r">1</td><td class="r">${esc(tot)}</td></tr></table>
    <div class="totals"><div class="tl"><span>${L('invTotal')}</span><span>${esc(tot)}</span></div></div>
    ${v.notes ? `<div style="margin-top:12px">${esc(v.notes)}</div>` : ''}
    <div class="ft">${esc(s.footer || L('invFooterDefault'))}</div>
  </div>`;
}
function invoiceText(v){
  const L = invLabels(v), s = v.seller || {};
  const out = [
    s.businessName, s.address, s.phone, s.taxId ? L('bizTax') + ': ' + s.taxId : '', '',
    L('invoice') + ' ' + L('invNo') + ' ' + invNo(v.number) + ' · ' + invDateStr(v),
    L('invBuyer') + ': ' + v.buyerName + (v.buyerPhone ? ' / ' + v.buyerPhone : ''), '',
    v.itemName + (v.itemCondition ? ' (' + L('g' + v.itemCondition) + ')' : ''),
    v.itemSerial ? L('invSerial') + ': ' + v.itemSerial : '',
    L('invTotal') + ': ' + fmtMoney(v.amount, v.currency, v.lang),
    L('invPaid') + ': ' + L('pay_' + v.payment),
    v.warrantyDays > 0 ? L('invWarranty') + ': ' + v.warrantyDays + ' ' + L('days') : '',
    v.notes || '', '', s.footer || L('invFooterDefault')
  ];
  return out.filter((x, idx) => x !== '' || (idx > 0 && out[idx - 1] !== '')).join('\n');
}

    });
  };
}

/* ============ Exports CSV (copie dans le presse-papiers) ============ */
const csvStr = v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
const csvNum = n => Number(n || 0).toFixed(2).replace('.', ',');
const csv = rows => rows.map(r => r.map(c => typeof c === 'number' ? csvNum(c) : csvStr(c)).join(';')).join('\n');

/* ============ Annonce ============ */
function shareText(i){
  return [ t('adTitle'), t(i.type) + ' · ' + i.name, t('adState') + ': ' + t('g' + (i.condition || 'B')), i.serial ? t('adSerial') + ': ' + i.serial : '',
    i.notes || '', '💰 ' + t('adPrice') + ': ' + money(num(i.price)), t('adContact') ].filter(Boolean).join('\n');
}

/* ============ Actions ============ */
function act(a, id, el){
  const i = id ? S.items.find(x => x.id === id) : null;
  switch (a) {
    case 'backdrop': case 'close': closeModal(); break;
    case 'nav': ST.view = id; render(); window.scrollTo(0, 0); break;
    case 'lang': S.lang = id; save(); render(); break;
    case 'per': ST[el.dataset.scope] = id; render(); break;
    case 'sf': ST.stockFilter = id; render(); break;
    case 'tf': ST.typeFilter = id; render(); break;
    case 'add': openForm(); break;
    case 'open': openItem(id); break;
    case 'sale': openSale(id); break;
    case 'edit': openForm(id); break;
    case 'sell': openSell(id); break;
    case 'share': if (i) { copy(shareText(i), t('adCopied')); } break;
    case 'grade': $('f-cond').value = id; document.querySelectorAll('.gbtn').forEach(b => b.classList.toggle('on', b.dataset.id === id)); $('g-hint').textContent = gradeLabel(id); break;
    case 'reserve': if (i) { i.status = i.status === 'reserved' ? 'stock' : 'reserved'; sync('upsert', { item: i }); closeModal(); render(); } break;
    case 'del':
      if (!i) break;
      if (invMap()[id]) { toast(t('delBlocked')); break; }
      ask(t('delAsk'), () => { S.items = S.items.filter(x => x.id !== id); sync('delete', { id }); closeModal(); render(); });
      break;
    case 'unsell':
      if (!i) break;
      if (invMap()[id]) { toast(t('hasInvoice')); break; }
      ask(t('cancelSaleAsk'), () => { i.status = 'stock'; delete i.soldPrice; delete i.soldDate; delete i.buyer; sync('upsert', { item: i }); closeModal(); render(); });
      break;
    case 'invoice': openInvoiceForm(id); break;
    case 'viewInv': { const v = S.invoices.find(x => x.id === id); if (v) openInvoice(v); break; }
    case 'print': try { window.print(); } catch(e) { toast(t('printHint')); } break;
    case 'saveBiz': {
      const g = k => $(k).value.trim();
      S.profile = { businessName: g('b-name'), address: g('b-addr'), phone: g('b-phone'), taxId: g('b-tax'), footer: g('b-foot'), currency: S.currency };
      sync('profile_save', { profile: S.profile }).then(() => { toast(t('bizSaved')); render(); });
      break;
    }
    case 'exportJson': copy(JSON.stringify({ items: S.items, invoices: S.invoices, profile: S.profile }), t('backupCopied')); break;
    case 'csvStock':
      copy(csv([[t('fName'), t('fType'), t('fCond'), t('fSerial'), t('status'), t('fCost'), t('fRepair'), t('fPrice'), t('date')]].concat(
        S.items.filter(x => x.status !== 'sold').map(x => [x.name, t(x.type), x.condition, x.serial || '', t(x.status === 'reserved' ? 'reserved' : 'available'), num(x.cost), num(x.repair), num(x.price), x.created ? ymd(new Date(x.created)) : '']))), t('csvCopied'));
      break;
    case 'csvSales': {
      const m = invMap();
      copy(csv([[t('date'), t('fName'), t('fSerial'), t('buyerLbl'), t('soldPrice'), t('totalCost'), t('margin'), t('invNo')]].concat(
        aggPeriod(ST.sales).list.map(x => [x.soldDate, x.name, x.serial || '', x.buyer || '', num(x.soldPrice), totalCost(x), num(x.soldPrice) - totalCost(x), m[x.id] ? invNo(m[x.id].number) : ''])), ), t('csvCopied'));
      break;
    }
    case 'csvInv':
      copy(csv([[t('invNo'), t('date'), t('buyerLbl'), t('buyerPhone'), t('fName'), t('fSerial'), t('invTotal'), t('currency'), t('payment'), t('invWarranty')]].concat(
        invFiltered().map(v => [invNo(v.number), v.date, v.buyerName, v.buyerPhone || '', v.itemName, v.itemSerial || '', Number(v.amount), v.currency, t('pay_' + v.payment), v.warrantyDays]))), t('csvCopied'));
      break;
    case 'lb': openLightbox(el.dataset.u); break;
    case 'lbclose': { const d = $('lb'); if (d) d.remove(); break; }
    case 'copyVitrine': copy(new URL('vitrine.html', location.href).href, t('linkCopied')); break;
    case 'retry': ST.loading = true; render(); refresh(); break;
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.a === 'backdrop' && e.target !== el) return;
  act(el.dataset.a, el.dataset.id, el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ST.q = e.target.value; $('list').innerHTML = stockList(); }
  if (e.target.id === 'iq') { ST.iq = e.target.value; $('ilist').innerHTML = invList(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'cur') { S.currency = e.target.value; save(); render(); sync('profile_save', { profile: Object.assign({}, S.profile, { currency: S.currency }) }); }
  if (e.target.id === 'sort') { ST.sort = e.target.value; $('list').innerHTML = stockList(); }
});

render();
refresh();
</script>
</body>
</html>
